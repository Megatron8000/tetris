name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk panelki-tetris.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: panelki-tetris-apk
          path: panelki-tetris.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "ПАНЕЛЬКИ — последняя APK-сборка"
          body: |
            Автоматическая Android-сборка игры «ПАНЕЛЬКИ».
            APK рассчитан на установку на Android 7.0 и новее.
            Это debug-сборка для тестирования.
          files: panelki-tetris.apk
          overwrite_files: true
          make_latest: true
